# Integración continua: en cada push y pull request se instalan las dependencias fijadas en
# uv.lock, se revisa el estilo con ruff y se corren las pruebas de tests/ (datos sintéticos y una
# base de MLflow temporal: no descargan nada).
name: CI

on:
  push:
  pull_request:

jobs:
  lint-y-pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar dependencias desde uv.lock
        run: uv sync --frozen --python 3.12

      - name: Revisar estilo con ruff
        run: uv run --frozen ruff check

      - name: Correr pruebas con pytest (Pipeline, Optuna y Model Registry)
        run: uv run --frozen pytest tests
