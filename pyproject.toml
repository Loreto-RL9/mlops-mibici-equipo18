[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mibici"
version = "0.0.1"
description = "Predicci\u00f3n de demanda horaria por estaci\u00f3n del sistema MiBici (Guadalajara) con pr\u00e1cticas de MLOps."
authors = [
  { name = "Equipo 18 - TC5044.10 (Tec de Monterrey)" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = ">=3.10"
dependencies = [
    "holidays>=0.50",
    "joblib>=1.3",
    "loguru>=0.7",
    "matplotlib>=3.8",
    "mlflow>=3.0",
    "numpy>=1.26",
    "optuna>=4.0",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",
    "tqdm>=4.66",
    "typer>=0.12",
]

[dependency-groups]
# Herramientas de desarrollo: uv sync las instala por omisión
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]


[tool.ruff]
line-length = 99
src = ["mibici"]
include = ["pyproject.toml", "mibici/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["mibici"]
force-sort-within-sections = true

